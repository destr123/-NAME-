<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Имя и юзернейм — Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    /* ===== ПОЛНЫЙ СБРОС И ФИКСАЦИЯ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПАПОРОТНИКИ (ДВА В НИЖНЕМ ПРАВОМ УГЛУ) ===== */
    .fern-bg {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      stroke: #e5e7e5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      bottom: 0%;
      right: 0%;
      width: 55%;
      height: 60%;
      transform: rotate(-4deg);
      opacity: 0.45;
    }

    .fern-2 {
      bottom: 0%;
      right: -2%;
      width: 38%;
      height: 45%;
      transform: rotate(8deg);
      opacity: 0.35;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-bottom: 4%;
    }

    /* ===== ЛОГОТИП ===== */
    .logo {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    /* ===== АВАТАРКА ===== */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      position: relative;
    }

    .avatar-hint {
      font-size: 13px;
      color: #b0b0b0;
      font-weight: 400;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      transform: rotate(-3deg);
      margin-bottom: 12px;
      letter-spacing: 0.3px;
      opacity: 0.7;
      font-style: italic;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f0f0f0;
      border: 2px dashed #d0d0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #b0b0b0;
      transition: border-color 0.3s ease;
      cursor: pointer;
      font-family: 'Inconsolata', monospace;
      user-select: none;
    }

    .avatar-circle:hover {
      border-color: #2b7a4b;
    }

    /* ===== ЗАГОЛОВКИ ===== */
    .main-headline {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #1e1e1e;
      margin-bottom: 16px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .sub-headline {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.2px;
      color: #1e1e1e;
      margin-bottom: 16px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    /* ===== ГРУППЫ ПОЛЕЙ ===== */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #1e1e1e;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 18px 20px;
      font-size: 17px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      color: #1e1e1e;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-field:focus {
      border-color: #2b7a4b;
      box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.08);
    }

    .input-field.error {
      border-color: #e74c3c;
    }

    .input-field::placeholder {
      color: #b0b0b0;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .input-hint {
      font-size: 13px;
      color: #b0b0b0;
      margin-top: 6px;
      padding-left: 4px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .error-message {
      display: none;
      font-size: 13px;
      color: #e74c3c;
      margin-top: 6px;
      padding-left: 4px;
      animation: shake 0.3s ease;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .error-message.visible {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* ===== КНОПКА ===== */
    .cta-button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    .cta-button:disabled {
      opacity: 0.6;
      transform: none;
    }

    /* ===== ССЫЛКА ===== */
    .footer-link {
      margin-top: auto;
      text-align: center;
      font-size: 15px;
      color: #4a4a4a;
      font-weight: 400;
      padding-top: 20px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .footer-link a {
      color: #2b7a4b;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      cursor: pointer;
      font-variation-settings: 'wght' 500;
    }
    .footer-link a:active {
      border-bottom-color: #2b7a4b;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 16px; }
      .input-field { padding: 16px 18px; font-size: 16px; }
      .cta-button { padding: 16px; font-size: 16px; }
      .main-headline { font-size: 20px; }
      .sub-headline { font-size: 16px; }
      .avatar-circle { width: 64px; height: 64px; font-size: 22px; }
      .avatar-hint { font-size: 11px; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 24px 16px 20px; }
      .main-headline { font-size: 18px; }
      .sub-headline { font-size: 14px; }
      .input-field { padding: 14px 16px; font-size: 15px; }
      .cta-button { padding: 14px; font-size: 15px; }
      .avatar-circle { width: 56px; height: 56px; font-size: 18px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (min-aspect-ratio: 9/16) {
      .content { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Папоротники (нижний правый угол) -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M380 390 C350 340 300 270 250 210 C210 160 175 120 155 85 C145 68 138 55 135 42" stroke="#e5e7e5" stroke-width="2.2"/>
      <path d="M300 270 C280 280 260 290 245 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M300 270 C320 280 340 290 355 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M260 220 C242 228 225 235 212 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M260 220 C278 228 295 235 308 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M225 175 C210 182 195 188 185 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M225 175 C240 182 255 188 265 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M195 140 C183 146 172 152 165 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M195 140 C207 146 218 152 225 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 110 C160 115 152 120 148 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M170 110 C180 115 188 120 192 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M135 42 C125 48 118 52 115 58" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M135 42 C145 48 152 52 155 58" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M280 290 C260 250 230 200 200 160 C178 130 160 105 150 85 C145 75 142 68 140 60" stroke="#e5e7e5" stroke-width="2.0"/>
      <path d="M230 200 C215 208 200 215 190 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M230 200 C245 208 260 215 270 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M200 160 C188 168 175 175 168 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M200 160 C212 168 225 175 232 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M170 130 C160 136 152 142 148 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 130 C180 136 188 142 192 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M150 105 C142 110 136 115 133 122" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M150 105 C158 110 164 115 167 122" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <!-- Логотип -->
    <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

    <!-- Аватар -->
    <div class="avatar-section">
      <span class="avatar-hint">здесь можно поставить аватарку</span>
      <div class="avatar-circle" id="avatarCircle">+</div>
    </div>

    <!-- Заголовок -->
    <h1 class="main-headline">Как тебя назвать?</h1>

    <!-- Поле Имя -->
    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" class="input-field" id="nameInput" placeholder="Имя или псевдоним" autocomplete="given-name" />
        <div class="error-message" id="nameError"></div>
      </div>
    </div>

    <!-- Подзаголовок -->
    <h2 class="sub-headline">Придумаем юзернейм</h2>

    <!-- Поле Юзернейм -->
    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" class="input-field" id="usernameInput" placeholder="@username" autocomplete="username" />
        <div class="error-message" id="usernameError"></div>
        <div class="input-hint">По нему тебя смогут найти другие пользователи</div>
      </div>
    </div>

    <!-- Кнопка -->
    <button class="cta-button" id="nextBtn">ДАЛЕЕ</button>

    <!-- Ссылка назад (опционально) -->
    <div class="footer-link">
      <a href="#" id="backLink">← назад</a>
    </div>

  </div>
</div>

<script>
  (function() {
    const appScreen = document.getElementById('appScreen');
    const nameInput = document.getElementById('nameInput');
    const usernameInput = document.getElementById('usernameInput');
    const nextBtn = document.getElementById('nextBtn');
    const backLink = document.getElementById('backLink');

    const nameError = document.getElementById('nameError');
    const usernameError = document.getElementById('usernameError');

    const avatarCircle = document.getElementById('avatarCircle');

    // ===== ЗАГРУЗКА =====
    setTimeout(() => {
      appScreen.style.opacity = '1';
      appScreen.style.transform = 'translateY(0)';
    }, 50);

    // ===== АВАТАР =====
    avatarCircle.addEventListener('click', function() {
      const emojis = ['😊', '🌟', '🦊', '🐱', '🌸', '✨', '🎯', '🌿', '💫', '🪐'];
      const current = this.textContent;
      let random = emojis[Math.floor(Math.random() * emojis.length)];
      while (random === current && emojis.length > 1) {
        random = emojis[Math.floor(Math.random() * emojis.length)];
      }
      this.textContent = random;
      this.style.borderColor = '#2b7a4b';
      this.style.borderStyle = 'solid';
    });

    // ===== ВАЛИДАЦИЯ =====
    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.add('error');
    }

    function hideError(el) {
      el.classList.remove('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.remove('error');
    }

    function isValidUsername(username) {
      return /^[a-zA-Z0-9_]{3,20}$/.test(username);
    }

    function isUsernameTaken(username) {
      // Имитация проверки уникальности
      const taken = ['admin', 'user', 'test', 'root', 'support'];
      return taken.includes(username.toLowerCase());
    }

    function clearErrors() {
      hideError(nameError);
      hideError(usernameError);
    }

    function validate() {
      clearErrors();

      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();

      let valid = true;

      // Имя
      if (!name) {
        showError(nameError, 'Пожалуйста, введите имя или псевдоним');
        valid = false;
      } else if (name.length < 2) {
        showError(nameError, 'Имя должно содержать минимум 2 символа');
        valid = false;
      }

      // Юзернейм
      if (!username) {
        showError(usernameError, 'Пожалуйста, придумайте юзернейм');
        valid = false;
      } else if (!isValidUsername(username)) {
        showError(usernameError, 'Только латиница, цифры и _, 3-20 символов');
        valid = false;
      } else if (isUsernameTaken(username)) {
        showError(usernameError, 'Этот юзернейм уже занят, попробуйте другой');
        valid = false;
      }

      return valid;
    }

    // ===== КНОПКА =====
    nextBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (validate()) {
        appScreen.style.opacity = '0';
        appScreen.style.transform = 'translateY(-8px)';
        appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        setTimeout(() => {
          window.location.href = 'https://destr123.github.io/demo-site/goal';
        }, 350);
      }
    });

    // ===== ОЧИСТКА ОШИБОК =====
    nameInput.addEventListener('input', () => hideError(nameError));
    usernameInput.addEventListener('input', () => hideError(usernameError));

    // ===== НАЗАД =====
    backLink.addEventListener('click', function(e) {
      e.preventDefault();
      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/demo-site/reg';
      }, 350);
    });

    // ===== ENTER =====
    usernameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') nextBtn.click();
    });

    // ===== БЛОКИРОВКА СКРОЛЛА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

  })();
</script>

</body>
</html>
