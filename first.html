<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ты не один</title>
  <style>
    /* Полный сброс и фиксация */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Полноэкранный контейнер */
    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* для мобильных с динамической панелью */
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ===== ДЕКОРАТИВНЫЙ ФОН — ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      opacity: 0.22;
      stroke: #d9d9d9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      top: -6%;
      right: -14%;
      width: 82%;
      height: 70%;
      transform: rotate(18deg);
      opacity: 0.18;
    }

    .fern-2 {
      bottom: -8%;
      left: -18%;
      width: 90%;
      height: 60%;
      transform: rotate(-12deg);
      opacity: 0.16;
    }

    .fern-3 {
      top: 28%;
      left: -12%;
      width: 50%;
      height: 40%;
      transform: rotate(40deg);
      opacity: 0.13;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 6%;
      min-height: 0;
    }

    /* Основной заголовок — "печатается" */
    .main-headline {
      font-size: clamp(28px, 7.5vw, 42px);
      font-weight: 650;
      line-height: 1.15;
      letter-spacing: -0.4px;
      color: #1e1e1e;
      max-width: 100%;
      margin-bottom: 28px;
    }

    /* Эффект печатной машинки — каретка */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 0.85em;
      background: #1e1e1e;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Подзаголовок */
    .sub-headline {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 420;
      line-height: 1.4;
      color: #4a4a4a;
      letter-spacing: 0.1px;
      margin-bottom: 48px;
      max-width: 90%;
    }

    /* Кнопка */
    .cta-button {
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      padding: 18px 40px;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      width: 100%;
      max-width: 300px;
      text-align: center;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    /* Нижний колонтитул — очень лёгкий */
    .footer-note {
      margin-top: auto;
      padding-top: 20px;
      font-size: 12px;
      color: #c8c8c8;
      letter-spacing: 0.3px;
      text-align: center;
      width: 100%;
      font-weight: 400;
      z-index: 1;
      position: relative;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen {
        padding: 32px 20px 28px;
      }
      .sub-headline {
        margin-bottom: 36px;
      }
      .cta-button {
        padding: 16px 32px;
        max-width: 100%;
      }
      .fern-1 { width: 100%; right: -10%; }
      .fern-2 { width: 100%; left: -10%; }
    }

    @media (max-width: 360px) {
      .app-screen {
        padding: 24px 16px 20px;
      }
      .main-headline {
        font-size: 24px;
      }
      .sub-headline {
        font-size: 14px;
      }
    }

    /* Для очень высоких экранов */
    @media (min-aspect-ratio: 9/16) {
      .content {
        padding-bottom: 0;
      }
    }

    /* Интерактив для демонстрации печати — по клику */
    .typewriter-demo {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div class="app-screen">

  <!-- Фоновые папоротники — декоративный слой -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 20 C120 60 80 120 60 180 C50 210 45 240 50 270 C55 300 70 330 90 350 C110 370 130 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 20 C180 60 220 120 240 180 C250 210 255 240 250 270 C245 300 230 330 210 350 C190 370 170 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 40 C130 80 100 130 85 180 C78 210 75 240 80 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 40 C170 80 200 130 215 180 C222 210 225 240 220 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 60 C140 100 125 150 120 200 C118 220 118 240 122 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M150 60 C160 100 175 150 180 200 C182 220 182 240 178 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M85 180 C75 200 68 220 65 240" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M215 180 C225 200 232 220 235 240" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 380 C60 340 100 280 140 220 C160 190 175 160 185 130 C195 100 200 70 195 40 C190 20 180 10 170 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M30 380 C0 340 -40 280 -80 220 C-100 190 -115 160 -125 130 C-135 100 -140 70 -135 40 C-130 20 -120 10 -110 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M50 360 C70 320 100 270 130 220 C145 195 155 170 162 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M10 360 C-10 320 -40 270 -70 220 C-85 195 -95 170 -102 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M70 340 C90 300 115 255 140 210 C150 190 158 170 163 150" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M-10 340 C-30 300 -55 255 -80 210 C-90 190 -98 170 -103 150" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-3" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 280 C40 240 80 180 110 120 C125 90 135 60 138 30 C139 15 135 5 130 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M20 280 C0 240 -40 180 -70 120 C-85 90 -95 60 -98 30 C-99 15 -95 5 -90 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M30 260 C50 220 80 170 105 120 C115 100 122 80 125 60" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M10 260 C-10 220 -40 170 -65 120 C-75 100 -82 80 -85 60" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>
  </div>

  <!-- Основной контент -->
  <div class="content">

    <!-- Заголовок с эффектом печатной машинки -->
    <h1 class="main-headline typewriter-demo" id="headline">
      Иногда тебя понимает только тот, кто чувствует то же самое
      <span class="typewriter-cursor" id="cursor"></span>
    </h1>

    <!-- Подзаголовок -->
    <p class="sub-headline">
      Расскажи о себе и найди похожих людей!
    </p>

    <!-- Кнопка -->
    <button class="cta-button" id="mainCta">
      РАССКАЗАТЬ!
    </button>
  </div>

  <!-- Лёгкий футер для достоверности -->
  <div class="footer-note">
    Ты не один
  </div>
</div>

<script>
  (function() {
    // Демонстрация эффекта печатной машинки — при клике на заголовок
    const headline = document.getElementById('headline');
    const fullText = 'Иногда тебя понимает только тот, кто чувствует то же самое';

    // Функция "печатания"
    function typeEffect(text, element, speed = 45) {
      let index = 0;
      let displayed = '';

      // Очищаем текст, но сохраняем курсор
      element.textContent = '';

      function typeChar() {
        if (index < text.length) {
          displayed += text.charAt(index);
          // Вставляем текст без курсора
          element.textContent = displayed;
          // Добавляем курсор в конец
          const cursorSpan = document.createElement('span');
          cursorSpan.className = 'typewriter-cursor';
          element.appendChild(cursorSpan);
          index++;
          setTimeout(typeChar, speed);
        } else {
          // Текст напечатан — курсор остаётся
          const cursorSpan = document.createElement('span');
          cursorSpan.className = 'typewriter-cursor';
          element.appendChild(cursorSpan);
        }
      }

      typeChar();
    }

    // При клике на заголовок — перепечатываем
    headline.addEventListener('click', function(e) {
      e.stopPropagation();
      // Сбрасываем и печатаем заново
      typeEffect(fullText, this, 40);
    });

    // Кнопка "РАССКАЗАТЬ!" — лёгкий фидбек
    const ctaBtn = document.getElementById('mainCta');
    ctaBtn.addEventListener('click', function() {
      alert('🚀 Экран анкеты');
      this.style.transform = 'scale(0.95)';
      setTimeout(() => {
        this.style.transform = '';
      }, 150);
    });

    // При загрузке — напечатать текст автоматически
    window.addEventListener('load', function() {
      setTimeout(() => {
        typeEffect(fullText, headline, 50);
      }, 300);
    });

    // Блокировка скролла и зума жестами
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

  })();
</script>

</body>
</html>
