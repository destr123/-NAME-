<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>10 фонов с папоротником</title>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: #f5f5f7;
            color: #1e1e1e;
            padding: 24px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #1e1e1e;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            font-weight: 400;
            margin-bottom: 32px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .card-preview {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #ffffff;
            overflow: hidden;
        }

        .card-preview svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 16px 20px 20px;
        }

        .card-info .name {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e1e;
            margin-bottom: 4px;
        }

        .card-info .desc {
            font-size: 12px;
            color: #999;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .card-info .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 10px;
            color: #666;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 28px 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
            padding: 4px 8px;
        }

        .modal-close:hover {
            color: #1e1e1e;
        }

        .modal-preview {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            margin-bottom: 16px;
        }

        .modal-preview svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-code {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 11px;
            font-family: 'Inconsolata', monospace;
            color: #444;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            margin-top: 8px;
        }

        .modal-code-label {
            font-size: 12px;
            color: #888;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 12px;
        }

        .copy-btn {
            background: #2b7a4b;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-family: 'Inconsolata', monospace;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .copy-btn:hover {
            background: #1d5c34;
        }

        .copy-btn.copied {
            background: #888;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card-info .name {
                font-size: 13px;
            }
            .card-info .desc {
                font-size: 10px;
            }
            .modal-content {
                padding: 20px 16px;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            document.body.style.overflow = 'hidden';

        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // КОПИРОВАНИЕ
        // ============================================================

        copyBtn.addEventListener('click', async () => {
            const text = modalCode.textContent;
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = '✅ Скопировано!';
                copyBtn.className = 'copy-btn copied';
                setTimeout(() => {
                    copyBtn.textContent = '📋 Скопировать';
                    copyBtn.className = 'copy-btn';
                }, 2000);
            } catch (err) {
                // fallback
                const range = document.createRange();
                range.selectNode(modalCode);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                copyBtn.textContent = '✅ Скопировано!';
                copyBtn.className = 'copy-btn copied';
                setTimeout(() => {
                    copyBtn.textContent = '📋 Скопировать';
                    copyBtn.className = 'copy-btn';
                }, 2000);
            }
        });

        // ============================================================
        // БЛОКИРОВКА ЗУМА
        // ============================================================

        document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
</body>
</html>
