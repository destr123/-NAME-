<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Расскажи о себе — Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПАПОРОТНИКИ (ТОЧНО КАК В REG.HTML) ===== */
    .fern-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      opacity: 0.22;
      stroke: #d9d9d9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      top: -6%;
      right: -14%;
      width: 82%;
      height: 70%;
      transform: rotate(18deg);
      opacity: 0.18;
    }

    .fern-2 {
      bottom: -8%;
      left: -18%;
      width: 90%;
      height: 60%;
      transform: rotate(-12deg);
      opacity: 0.16;
    }

    .fern-3 {
      top: 28%;
      left: -12%;
      width: 50%;
      height: 40%;
      transform: rotate(40deg);
      opacity: 0.13;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-bottom: 4%;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    .main-headline {
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #1e1e1e;
      margin-bottom: 8px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .sub-headline {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 400;
      color: #4a4a4a;
      margin-bottom: 20px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    /* ===== ТЕКСТОВОЕ ПОЛЕ ===== */
    .textarea-group {
      margin-bottom: 16px;
    }

    .textarea-field {
      width: 100%;
      min-height: 120px;
      padding: 18px 20px;
      font-size: 17px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      color: #1e1e1e;
      background: #ffffff;
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      resize: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .textarea-field:focus {
      border-color: #2b7a4b;
      box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.08);
    }

    .textarea-field::placeholder {
      color: #b0b0b0;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ===== КНОПКА СОСТОЯНИЙ ===== */
    .mood-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #ffffff;
      border: 1.5px solid #e0e0e0;
      border-radius: 60px;
      font-family: 'Inconsolata', monospace;
      font-size: 14px;
      font-weight: 400;
      color: #1e1e1e;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      margin-bottom: 16px;
    }

    .mood-toggle:hover {
      border-color: #b0b0b0;
    }

    .mood-toggle:active {
      transform: scale(0.96);
    }

    .mood-toggle.active {
      border-color: #2b7a4b;
      background: rgba(43, 122, 75, 0.06);
    }

    .mood-toggle .icon {
      font-size: 18px;
    }

    /* ===== ПАНЕЛЬ СОСТОЯНИЙ ===== */
    .mood-panel {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(245, 245, 245, 0.6);
      border-radius: 16px;
    }

    .mood-panel.open {
      display: flex;
    }

    .mood-panel .label {
      width: 100%;
      font-size: 14px;
      color: #4a4a4a;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      margin-bottom: 4px;
    }

    .mood-chip {
      padding: 8px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 60px;
      font-family: 'Inconsolata', monospace;
      font-size: 14px;
      font-weight: 400;
      color: #1e1e1e;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .mood-chip:active {
      transform: scale(0.95);
    }

    .mood-chip.selected {
      border-color: #2b7a4b;
      background: rgba(43, 122, 75, 0.08);
      box-shadow: 0 0 0 2px rgba(43, 122, 75, 0.1);
    }

    /* ===== КНОПКА ===== */
    .cta-button {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      margin-top: 4px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 16px; }
      .cta-button { padding: 16px; font-size: 16px; max-width: 100%; }
      .textarea-field { min-height: 100px; font-size: 16px; padding: 16px 18px; }
      .mood-chip { font-size: 12px; padding: 6px 12px; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 24px 16px 20px; }
      .main-headline { font-size: 24px; }
      .sub-headline { font-size: 16px; }
      .cta-button { padding: 14px; font-size: 15px; }
      .textarea-field { min-height: 80px; font-size: 15px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Фоновые папоротники (ТОЧНО КАК В REG.HTML) -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 20 C120 60 80 120 60 180 C50 210 45 240 50 270 C55 300 70 330 90 350 C110 370 130 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 20 C180 60 220 120 240 180 C250 210 255 240 250 270 C245 300 230 330 210 350 C190 370 170 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 40 C130 80 100 130 85 180 C78 210 75 240 80 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 40 C170 80 200 130 215 180 C222 210 225 240 220 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 60 C140 100 125 150 120 200 C118 220 118 240 122 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M150 60 C160 100 175 150 180 200 C182 220 182 240 178 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M85 180 C75 200 68 220 65 240" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M215 180 C225 200 232 220 235 240" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 380 C60 340 100 280 140 220 C160 190 175 160 185 130 C195 100 200 70 195 40 C190 20 180 10 170 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M30 380 C0 340 -40 280 -80 220 C-100 190 -115 160 -125 130 C-135 100 -140 70 -135 40 C-130 20 -120 10 -110 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M50 360 C70 320 100 270 130 220 C145 195 155 170 162 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M10 360 C-10 320 -40 270 -70 220 C-85 195 -95 170 -102 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M70 340 C90 300 115 255 140 210 C150 190 158 170 163 150" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M-10 340 C-30 300 -55 255 -80 210 C-90 190 -98 170 -103 150" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-3" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 280 C40 240 80 180 110 120 C125 90 135 60 138 30 C139 15 135 5 130 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M20 280 C0 240 -40 180 -70 120 C-85 90 -95 60 -98 30 C-99 15 -95 5 -90 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M30 260 C50 220 80 170 105 120 C115 100 122 80 125 60" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M10 260 C-10 220 -40 170 -65 120 C-75 100 -82 80 -85 60" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

    <h1 class="main-headline">ТЕПЕРЬ САМОЕ ВАЖНОЕ!</h1>
    <p class="sub-headline">Расскажи о себе</p>

    <!-- Текстовое поле -->
    <div class="textarea-group">
      <textarea class="textarea-field" id="aboutText" placeholder="Что сейчас происходит с тобой?"></textarea>
    </div>

    <!-- Кнопка открытия состояний -->
    <button class="mood-toggle" id="moodToggle">
      <span class="icon">❤️</span>
      Как ты себя чувствуешь?
    </button>

    <!-- Панель состояний -->
    <div class="mood-panel" id="moodPanel">
      <span class="label">Выбери свои состояния:</span>
      <div class="mood-chip" data-mood="😔 Одиноко">😔 Одиноко</div>
      <div class="mood-chip" data-mood="😰 Тревожно">😰 Тревожно</div>
      <div class="mood-chip" data-mood="😡 Злюсь">😡 Злюсь</div>
      <div class="mood-chip" data-mood="🫥 Потерян">🫥 Потерян</div>
      <div class="mood-chip" data-mood="💔 Разбит">💔 Разбит</div>
      <div class="mood-chip" data-mood="🥱 Нет сил">🥱 Нет сил</div>
      <div class="mood-chip" data-mood="😄 Хорошо">😄 Хорошо</div>
      <div class="mood-chip" data-mood="🫂 Хочу поговорить">🫂 Хочу поговорить</div>
    </div>

    <button class="cta-button" id="doneBtn">ГОТОВО</button>

  </div>
</div>

<script>
  (function() {
    const appScreen = document.getElementById('appScreen');
    const aboutText = document.getElementById('aboutText');
    const moodToggle = document.getElementById('moodToggle');
    const moodPanel = document.getElementById('moodPanel');
    const moodChips = document.querySelectorAll('.mood-chip');
    const doneBtn = document.getElementById('doneBtn');

    let selectedMoods = [];

    // ===== АНИМАЦИЯ =====
    setTimeout(() => {
      appScreen.style.opacity = '1';
      appScreen.style.transform = 'translateY(0)';
    }, 50);

    // ===== TOGGLE ПАНЕЛИ =====
    moodToggle.addEventListener('click', function() {
      moodPanel.classList.toggle('open');
      this.classList.toggle('active');
    });

    // ===== ВЫБОР СОСТОЯНИЙ =====
    moodChips.forEach(chip => {
      chip.addEventListener('click', function() {
        this.classList.toggle('selected');
        const mood = this.dataset.mood;
        if (this.classList.contains('selected')) {
          if (!selectedMoods.includes(mood)) {
            selectedMoods.push(mood);
          }
        } else {
          selectedMoods = selectedMoods.filter(m => m !== mood);
        }
      });
    });

    // ===== КНОПКА "ГОТОВО" =====
    doneBtn.addEventListener('click', function(e) {
      e.preventDefault();

      const text = aboutText.value.trim();

      // Сохраняем данные
      sessionStorage.setItem('aboutText', text);
      sessionStorage.setItem('moods', JSON.stringify(selectedMoods));

      // Переход на welcome (отдельный экран)
      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/-NAME-/welcome';
      }, 350);
    });

    // ===== БЛОКИРОВКА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

  })();
</script>

</body>
</html>
