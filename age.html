<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Твой возраст — Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      stroke: #e5e7e5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      bottom: 0%;
      right: 0%;
      width: 55%;
      height: 60%;
      transform: rotate(-4deg);
      opacity: 0.45;
    }

    .fern-2 {
      bottom: 0%;
      right: -2%;
      width: 38%;
      height: 45%;
      transform: rotate(8deg);
      opacity: 0.35;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
      padding-bottom: 4%;
      text-align: center;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    .age-label {
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 400;
      color: #1e1e1e;
      margin-bottom: 8px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      letter-spacing: 1px;
    }

    .age-display {
      font-size: clamp(64px, 16vw, 96px);
      font-weight: 700;
      color: #1e1e1e;
      margin-bottom: 32px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
      line-height: 1;
    }

    /* ===== SLIDER ===== */
    .slider-container {
      width: 100%;
      max-width: 340px;
      padding: 0 8px;
      margin-bottom: 24px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      outline: none;
      background: #e0e0e0;
      transition: background 0.2s ease;
    }

    input[type="range"]::-webkit-slider-track {
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: #e0e0e0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2b7a4b;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(43, 122, 75, 0.25);
      transition: transform 0.15s ease;
      margin-top: -10px;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.1);
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 4px;
      background: #e0e0e0;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2b7a4b;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(43, 122, 75, 0.25);
    }

    input[type="range"]::-moz-range-progress {
      height: 4px;
      border-radius: 4px;
      background: #2b7a4b;
    }

    .slider-hint {
      font-size: 13px;
      color: #b0b0b0;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      max-width: 320px;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    /* ===== КНОПКА ===== */
    .cta-button {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 28px; }
      .cta-button { padding: 16px; font-size: 16px; }
      .age-display { font-size: 56px; margin-bottom: 24px; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 24px 16px 20px; }
      .age-display { font-size: 48px; }
      .cta-button { padding: 14px; font-size: 15px; }
      .slider-container { max-width: 280px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Папоротники -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M380 390 C350 340 300 270 250 210 C210 160 175 120 155 85 C145 68 138 55 135 42" stroke="#e5e7e5" stroke-width="2.2"/>
      <path d="M300 270 C280 280 260 290 245 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M300 270 C320 280 340 290 355 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M260 220 C242 228 225 235 212 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M260 220 C278 228 295 235 308 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M225 175 C210 182 195 188 185 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M225 175 C240 182 255 188 265 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M195 140 C183 146 172 152 165 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M195 140 C207 146 218 152 225 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 110 C160 115 152 120 148 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M170 110 C180 115 188 120 192 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M135 42 C125 48 118 52 115 58" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M135 42 C145 48 152 52 155 58" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M280 290 C260 250 230 200 200 160 C178 130 160 105 150 85 C145 75 142 68 140 60" stroke="#e5e7e5" stroke-width="2.0"/>
      <path d="M230 200 C215 208 200 215 190 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M230 200 C245 208 260 215 270 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M200 160 C188 168 175 175 168 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M200 160 C212 168 225 175 232 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M170 130 C160 136 152 142 148 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 130 C180 136 188 142 192 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M150 105 C142 110 136 115 133 122" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M150 105 C158 110 164 115 167 122" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

    <p class="age-label">ТВОЙ ВОЗРАСТ:</p>
    <div class="age-display" id="ageDisplay">18</div>

    <div class="slider-container">
      <input type="range" id="ageSlider" min="13" max="99" value="18" />
    </div>

    <p class="slider-hint">
      Точный возраст не отображается другим пользователям.<br />
      Он используется для подбора людей и обеспечения безопасности.
    </p>

    <button class="cta-button" id="confirmBtn">ПОДТВЕРДИТЬ</button>

  </div>
</div>

<script>
  (function() {
    const appScreen = document.getElementById('appScreen');
    const slider = document.getElementById('ageSlider');
    const ageDisplay = document.getElementById('ageDisplay');
    const confirmBtn = document.getElementById('confirmBtn');

    // ===== АНИМАЦИЯ ВХОДА =====
    setTimeout(() => {
      appScreen.style.opacity = '1';
      appScreen.style.transform = 'translateY(0)';
    }, 50);

    // ===== SLIDER =====
    slider.addEventListener('input', function() {
      ageDisplay.textContent = this.value;
    });

    // ===== КНОПКА =====
    confirmBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const age = parseInt(slider.value);

      // Сохраняем возраст (можно в sessionStorage или localStorage)
      sessionStorage.setItem('userAge', age);

      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/-NAME-/about';
      }, 350);
    });

    // ===== БЛОКИРОВКА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

  })();
</script>

</body>
</html>
