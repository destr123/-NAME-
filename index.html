<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    /* ===== БАЗА ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ===== ФОНОВЫЕ ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      stroke: #e5e7e5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       ПАПОРОТНИК 1 — БОЛЬШОЙ (ПРАВЫЙ ВЕРХНИЙ)
       Начинается от правого края, уходит вверх и влево
    ============================================================ */
    .fern-1 {
      top: -4%;
      right: -2%;
      width: 65%;
      height: 75%;
      transform: rotate(8deg);
      opacity: 0.55;
    }

    /* ============================================================
       ПАПОРОТНИК 2 — МАЛЕНЬКИЙ (ПРАВЫЙ НИЖНИЙ)
       Начинается от правого края, уходит вниз и влево
    ============================================================ */
    .fern-2 {
      bottom: -4%;
      right: -2%;
      width: 45%;
      height: 50%;
      transform: rotate(-6deg);
      opacity: 0.45;
    }

    /* ===== ОБЩИЕ СТИЛИ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-bottom: 4%;
      height: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    .main-headline {
      font-size: clamp(26px, 6.5vw, 36px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #1e1e1e;
      margin-bottom: 24px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .page-title {
      font-size: clamp(26px, 6.5vw, 36px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #1e1e1e;
      margin-bottom: 24px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .sub-title {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.2px;
      color: #1e1e1e;
      margin-bottom: 20px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .sub-headline {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 400;
      line-height: 1.4;
      color: #4a4a4a;
      margin-bottom: 48px;
      max-width: 90%;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #1e1e1e;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 500;
    }

    .input-wrapper { position: relative; }

    .input-field {
      width: 100%;
      padding: 18px 20px;
      font-size: 17px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      color: #1e1e1e;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-field:focus {
      border-color: #2b7a4b;
      box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.08);
    }
    .input-field.error { border-color: #e74c3c; }
    .input-field::placeholder {
      color: #b0b0b0;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .error-message {
      display: none;
      font-size: 13px;
      color: #e74c3c;
      margin-top: 6px;
      padding-left: 4px;
      animation: shake 0.3s ease;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .error-message.visible { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .cta-button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    .footer-link {
      margin-top: auto;
      text-align: center;
      font-size: 15px;
      color: #4a4a4a;
      font-weight: 400;
      padding-top: 20px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .footer-link a {
      color: #2b7a4b;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      font-variation-settings: 'wght' 500;
    }
    .footer-link a:active { border-bottom-color: #2b7a4b; }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 12px 0 28px;
      color: #b8b8b8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8e8;
    }

    .social-label {
      font-size: 15px;
      color: #4a4a4a;
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .social-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .social-btn {
      flex: 1;
      min-width: 80px;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid #e0e0e0;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      color: #1e1e1e;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 500;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      letter-spacing: 0.3px;
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .social-btn:active {
      transform: scale(0.96);
      border-color: #2b7a4b;
      background: #f8faf9;
    }
    .social-btn.telegram:hover { border-color: #0088cc; background: #f0f7fc; }
    .social-btn.google:hover { border-color: #ea4335; background: #fcf0ef; }
    .social-btn.apple:hover { border-color: #1e1e1e; background: #f5f5f5; }

    /* ===== ТИПОГРАФСКИЙ КУРСОР ===== */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 0.85em;
      background: #1e1e1e;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== КОНТЕЙНЕР ЭКРАНОВ ===== */
    .screen-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .screen-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: transparent;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
      will-change: transform, opacity;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    .screen-slide.first {
      transform: translateY(0);
      opacity: 1;
      z-index: 2;
    }

    .screen-slide.login {
      transform: translateY(100%);
      opacity: 0;
      z-index: 1;
    }

    .screen-slide.register {
      transform: translateY(100%);
      opacity: 0;
      z-index: 1;
    }

    .screen-slide.login.active {
      transform: translateY(0);
      opacity: 1;
      z-index: 3;
    }

    .screen-slide.register.active {
      transform: translateY(0);
      opacity: 1;
      z-index: 3;
    }

    .screen-slide.first.hidden {
      transform: translateY(-100%);
      opacity: 0;
      z-index: 0;
    }

    .screen-slide.register.to-login {
      transform: translateX(-100%);
      opacity: 0;
      z-index: 1;
    }

    .screen-slide.login.from-register {
      transform: translateX(100%);
      opacity: 0;
      z-index: 1;
    }

    .screen-slide.login.to-register {
      transform: translateX(100%);
      opacity: 0;
      z-index: 1;
    }

    .screen-slide.register.from-login {
      transform: translateX(-100%);
      opacity: 0;
      z-index: 1;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .screen-slide { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 32px; }
      .input-field { padding: 16px 18px; font-size: 16px; }
      .cta-button { padding: 16px; font-size: 16px; }
      .social-btn { font-size: 13px; padding: 12px 6px; min-width: 60px; }
      .social-btn svg { width: 18px; height: 18px; }
      .page-title { font-size: 22px; }
      .sub-title { font-size: 18px; }
    }

    @media (max-width: 360px) {
      .screen-slide { padding: 24px 16px 20px; }
      .main-headline { font-size: 22px; }
      .page-title { font-size: 20px; }
      .sub-title { font-size: 16px; }
      .input-field { padding: 14px 16px; font-size: 15px; }
      .cta-button { padding: 14px; font-size: 15px; }
      .footer-link { font-size: 13px; }
      .social-btn { font-size: 12px; padding: 10px 4px; min-width: 50px; }
      .social-btn svg { width: 16px; height: 16px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .screen-slide { padding: 48px 32px 40px; }
    }

    @media (min-aspect-ratio: 9/16) {
      .content { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="app-screen">
  <!-- ============================================================
       ФОНОВЫЕ ПАПОРОТНИКИ (ДВА, С ПРАВОГО КРАЯ)
  ============================================================ -->
  <div class="fern-bg" aria-hidden="true">

    <!-- ПАПОРОТНИК 1 — БОЛЬШОЙ (правый верхний) -->
    <svg class="fern fern-1" viewBox="0 0 500 600" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Стебель — начинается от правого края, уходит вверх-влево -->
      <path d="M480 300 C450 250 400 180 340 120 C290 70 240 30 200 10 C180 0 165 -5 155 -8" stroke="#e5e7e5" stroke-width="2.2"/>

      <path d="M440 270 C460 280 480 290 495 300" stroke="#e5e7e5" stroke-width="1.8"/>

      <path d="M285 85 C273 92 260 98 252 108" stroke="#e5e7e5" stroke-width="1.1"/>

      <path d="M210 10 C205 13 200 16 197 20" stroke="#e5e7e5" stroke-width="0.8"/>

      <path d="M155 -8 C145 -15 135 -18 128 -14 C122 -10 125 -3 130 0" stroke="#e5e7e5" stroke-width="1.2"/>
    </svg>

    <!-- ПАПОРОТНИК 2 — МАЛЕНЬКИЙ (правый нижний) -->
    <svg class="fern fern-2" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Стебель — начинается от правого края, уходит вниз-влево -->
      <path d="M380 100 C350 150 300 210 250 260 C210 300 175 330 150 350 C135 360 125 368 118 372" stroke="#e5e7e5" stroke-width="2.0"/>

      <!-- ЛИСТЬЯ (6 пар, асимметричные) -->

      <!-- Пара 1 -->
      <path d="M340 160 C320 170 300 180 285 190" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M340 160 C360 170 380 180 395 190" stroke="#e5e7e5" stroke-width="1.6"/>

      <!-- Пара 2 -->
      <path d="M300 210 C282 218 265 225 252 235" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M300 210 C318 218 335 225 348 235" stroke="#e5e7e5" stroke-width="1.4"/>

      <!-- Пара 3 -->
      <path d="M260 258 C245 265 230 272 220 282" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M260 258 C275 265 290 272 300 282" stroke="#e5e7e5" stroke-width="1.2"/>

      <!-- Пара 4 -->
      <path d="M225 298 C212 305 200 312 192 322" stroke="#e5e7e5" stroke-width="1.1"/>
      <path d="M225 298 C238 305 250 312 258 322" stroke="#e5e7e5" stroke-width="1.1"/>

      <!-- Пара 5 -->
      <path d="M190 332 C180 338 170 345 165 355" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M190 332 C200 338 210 345 215 355" stroke="#e5e7e5" stroke-width="1.0"/>

      <!-- Пара 6 (самая нижняя) -->
      <path d="M160 358 C152 363 145 368 140 375" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M160 358 C168 363 175 368 180 375" stroke="#e5e7e5" stroke-width="0.9"/>

      <!-- Завиток на конце -->
      <path d="M118 372 C108 378 100 380 95 376 C90 372 93 365 98 362" stroke="#e5e7e5" stroke-width="1.0"/>
    </svg>

  </div>

  <!-- КОНТЕЙНЕР ЭКРАНОВ -->
  <div class="screen-container">

    <!-- ======== ЭКРАН 1: FIRST ======== -->
    <div class="screen-slide first" id="screenFirst">
      <div class="content">
        <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

        <h1 class="main-headline" id="headline">
          Иногда тебя понимает только тот, кто чувствует то же самое
          <span class="typewriter-cursor"></span>
        </h1>

        <p class="sub-headline">
          Расскажи о себе и найди похожих людей!
        </p>

        <button class="cta-button" id="firstCta">РАССКАЗАТЬ!</button>
      </div>
    </div>

    <!-- ======== ЭКРАН 2: LOGIN ======== -->
    <div class="screen-slide login" id="screenLogin">
      <div class="content">
        <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

        <h1 class="page-title">Вход</h1>

        <p class="sub-title">Введи почту</p>

        <div class="input-group">
          <div class="input-wrapper">
            <input type="email" class="input-field" id="loginEmail" placeholder="Электронная почта" autocomplete="email" inputmode="email" />
            <div class="error-message" id="loginEmailError"></div>
          </div>
        </div>

        <div class="divider">ИЛИ</div>

        <p class="social-label">Войти с помощью:</p>

        <div class="social-buttons">
          <button class="social-btn telegram">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            TELEGRAM
          </button>
          <button class="social-btn google">
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            GOOGLE
          </button>
          <button class="social-btn apple">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            APPLE
          </button>
        </div>

        <div class="footer-link">
          Нет аккаунта? <a href="#" id="toRegister">зарегистрироваться</a>
        </div>
      </div>
    </div>

    <!-- ======== ЭКРАН 3: REGISTER ======== -->
    <div class="screen-slide register" id="screenRegister">
      <div class="content">
        <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

        <h1 class="page-title">Регистрация</h1>

        <p class="sub-title">Введи почту</p>

        <div class="input-group">
          <div class="input-wrapper">
            <input type="email" class="input-field" id="regEmail" placeholder="Электронная почта" autocomplete="email" inputmode="email" />
            <div class="error-message" id="regEmailError"></div>
          </div>
        </div>

        <div class="input-group">
          <label for="regPassword">Придумай пароль</label>
          <div class="input-wrapper">
            <input type="password" class="input-field" id="regPassword" placeholder="Пароль" autocomplete="new-password" />
            <div class="error-message" id="regPasswordError"></div>
          </div>
        </div>

        <div class="input-group">
          <label for="regConfirm">Повтори пароль</label>
          <div class="input-wrapper">
            <input type="password" class="input-field" id="regConfirm" placeholder="Повторите пароль" autocomplete="new-password" />
            <div class="error-message" id="regConfirmError"></div>
          </div>
        </div>

        <button class="cta-button" id="regNext">ДАЛЕЕ</button>

        <div class="footer-link">
          Уже есть аккаунт? <a href="#" id="toLogin">войти</a>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  (function() {
    'use strict';

    // ===== DOM =====
    const screenFirst = document.getElementById('screenFirst');
    const screenLogin = document.getElementById('screenLogin');
    const screenRegister = document.getElementById('screenRegister');

    const firstCta = document.getElementById('firstCta');
    const toRegister = document.getElementById('toRegister');
    const toLogin = document.getElementById('toLogin');
    const regNext = document.getElementById('regNext');

    // Поля и ошибки регистрации
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirm');
    const regEmailErr = document.getElementById('regEmailError');
    const regPassErr = document.getElementById('regPasswordError');
    const regConfirmErr = document.getElementById('regConfirmError');

    // Поле логина
    const loginEmail = document.getElementById('loginEmail');
    const loginEmailErr = document.getElementById('loginEmailError');

    // ===== СОСТОЯНИЕ =====
    let currentScreen = 'first';

    // ===== ОЧИСТКА КЛАССОВ =====
    function resetClasses() {
      screenFirst.className = 'screen-slide first';
      screenLogin.className = 'screen-slide login';
      screenRegister.className = 'screen-slide register';
    }

    // ===== ПЕРЕХОД: FIRST → LOGIN (ВЕРТИКАЛЬНЫЙ) =====
    function goToLoginFromFirst() {
      resetClasses();
      screenFirst.classList.add('hidden');
      screenLogin.classList.add('active');
      currentScreen = 'login';
    }

    // ===== ПЕРЕХОД: FIRST → REGISTER (ВЕРТИКАЛЬНЫЙ) =====
    function goToRegisterFromFirst() {
      resetClasses();
      screenFirst.classList.add('hidden');
      screenRegister.classList.add('active');
      currentScreen = 'register';
    }

    // ===== ПЕРЕХОД: LOGIN ↔ REGISTER (ГОРИЗОНТАЛЬНЫЙ) =====
    function goToLoginFromRegister() {
      screenRegister.classList.remove('active');
      screenRegister.classList.add('to-login');
      screenLogin.classList.remove('hidden', 'from-register');
      screenLogin.classList.add('from-register');

      setTimeout(() => {
        screenLogin.classList.remove('from-register');
        screenLogin.classList.add('active');
      }, 50);

      setTimeout(() => {
        screenRegister.classList.remove('to-login');
        screenRegister.className = 'screen-slide register';
      }, 500);

      currentScreen = 'login';
    }

    function goToRegisterFromLogin() {
      screenLogin.classList.remove('active');
      screenLogin.classList.add('to-register');
      screenRegister.classList.remove('hidden', 'from-login');
      screenRegister.classList.add('from-login');

      setTimeout(() => {
        screenRegister.classList.remove('from-login');
        screenRegister.classList.add('active');
      }, 50);

      setTimeout(() => {
        screenLogin.classList.remove('to-register');
        screenLogin.className = 'screen-slide login';
      }, 500);

      currentScreen = 'register';
    }

    // ===== ОБРАБОТЧИКИ =====
    firstCta.addEventListener('click', function() {
      goToLoginFromFirst();
    });

    toRegister.addEventListener('click', function(e) {
      e.preventDefault();
      if (currentScreen === 'login') {
        goToRegisterFromLogin();
      } else {
        goToRegisterFromFirst();
      }
    });

    toLogin.addEventListener('click', function(e) {
      e.preventDefault();
      if (currentScreen === 'register') {
        goToLoginFromRegister();
      } else {
        goToLoginFromFirst();
      }
    });

    // ===== ВАЛИДАЦИЯ РЕГИСТРАЦИИ =====

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.add('error');
    }

    function hideError(el) {
      el.classList.remove('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.remove('error');
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function clearRegErrors() {
      hideError(regEmailErr);
      hideError(regPassErr);
      hideError(regConfirmErr);
    }

    function validateRegister() {
      clearRegErrors();

      const email = regEmail.value.trim();
      const pass = regPassword.value.trim();
      const confirm = regConfirm.value.trim();

      let valid = true;

      if (!email) {
        showError(regEmailErr, 'Введите email');
        valid = false;
      } else if (!isValidEmail(email)) {
        showError(regEmailErr, 'Некорректный email');
        valid = false;
      }

      if (!pass) {
        showError(regPassErr, 'Придумайте пароль');
        valid = false;
      } else if (pass.length < 6) {
        showError(regPassErr, 'Минимум 6 символов');
        valid = false;
      }

      if (!confirm) {
        showError(regConfirmErr, 'Подтвердите пароль');
        valid = false;
      } else if (pass && confirm && pass !== confirm) {
        showError(regConfirmErr, 'Пароли не совпадают');
        valid = false;
      }

      return valid;
    }

    regNext.addEventListener('click', function() {
      if (validateRegister()) {
        alert('✅ Регистрация успешна! Переход на /username');
      }
    });

    regEmail.addEventListener('input', () => hideError(regEmailErr));
    regPassword.addEventListener('input', () => hideError(regPassErr));
    regConfirm.addEventListener('input', () => hideError(regConfirmErr));

    regEmail.addEventListener('blur', function() {
      const val = this.value.trim();
      if (val && !isValidEmail(val)) {
        showError(regEmailErr, 'Некорректный email');
      }
    });

    regConfirm.addEventListener('blur', function() {
      const pass = regPassword.value.trim();
      const confirm = this.value.trim();
      if (pass && confirm && pass !== confirm) {
        showError(regConfirmErr, 'Пароли не совпадают');
      }
    });

    regConfirm.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') regNext.click();
    });

    // ===== ЛОГИН =====
    loginEmail.addEventListener('blur', function() {
      const val = this.value.trim();
      if (val && !isValidEmail(val)) {
        showError(loginEmailErr, 'Некорректный email');
      } else {
        hideError(loginEmailErr);
      }
    });
    loginEmail.addEventListener('input', () => hideError(loginEmailErr));

    // ===== КНОПКИ СОЦСЕТЕЙ =====
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const provider = this.textContent.trim();
        alert(`🔐 Вход через ${provider}`);
        this.style.transform = 'scale(0.94)';
        setTimeout(() => this.style.transform = '', 150);
      });
    });

    // ===== ТИПОГРАФСКИЙ ЭФФЕКТ (С ФИКСОМ) =====
    const headline = document.getElementById('headline');
    const fullText = 'Иногда тебя понимает только тот, кто чувствует то же самое';
    let isTyping = false;
    let typeTimeout = null;

    function typeEffect(text, element, speed = 45) {
      if (isTyping) {
        clearTimeout(typeTimeout);
        isTyping = false;
      }

      let index = 0;
      let displayed = '';
      element.textContent = '';
      isTyping = true;

      function typeChar() {
        if (index < text.length) {
          displayed += text.charAt(index);
          element.textContent = displayed;
          const cursor = document.createElement('span');
          cursor.className = 'typewriter-cursor';
          element.appendChild(cursor);
          index++;
          typeTimeout = setTimeout(typeChar, speed);
        } else {
          const cursor = document.createElement('span');
          cursor.className = 'typewriter-cursor';
          element.appendChild(cursor);
          isTyping = false;
        }
      }

      typeChar();
    }

    setTimeout(() => typeEffect(fullText, headline, 50), 300);

    headline.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!isTyping) {
        typeEffect(fullText, this, 40);
      }
    });

    // ===== БЛОКИРОВКА СКРОЛЛА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    resetClasses();

  })();
</script>

</body>
</html>
