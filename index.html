<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПАПОРОТНИКИ (нижний правый угол) ===== */
    .fern-bg {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      stroke: #e5e7e5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      bottom: 0%;
      right: 0%;
      width: 55%;
      height: 60%;
      transform: rotate(-4deg);
      opacity: 0.45;
    }

    .fern-2 {
      bottom: 0%;
      right: -2%;
      width: 38%;
      height: 45%;
      transform: rotate(8deg);
      opacity: 0.35;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-bottom: 4%;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    .main-headline {
      font-size: clamp(26px, 6.5vw, 36px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #1e1e1e;
      margin-bottom: 24px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .sub-headline {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 400;
      line-height: 1.4;
      color: #4a4a4a;
      margin-bottom: 48px;
      max-width: 90%;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .cta-button {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    .footer-link {
      margin-top: auto;
      text-align: center;
      font-size: 15px;
      color: #4a4a4a;
      font-weight: 400;
      padding-top: 20px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .footer-link a {
      color: #2b7a4b;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      font-variation-settings: 'wght' 500;
    }
    .footer-link a:active {
      border-bottom-color: #2b7a4b;
    }

    /* ===== ТИПОГРАФСКИЙ КУРСОР ===== */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 0.85em;
      background: #1e1e1e;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 32px; }
      .cta-button { padding: 16px; font-size: 16px; max-width: 100%; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 24px 16px 20px; }
      .main-headline { font-size: 22px; }
      .sub-headline { font-size: 16px; }
      .cta-button { padding: 14px; font-size: 15px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Папоротники -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M380 390 C350 340 300 270 250 210 C210 160 175 120 155 85 C145 68 138 55 135 42" stroke="#e5e7e5" stroke-width="2.2"/>
      <path d="M300 270 C280 280 260 290 245 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M300 270 C320 280 340 290 355 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M260 220 C242 228 225 235 212 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M260 220 C278 228 295 235 308 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M225 175 C210 182 195 188 185 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M225 175 C240 182 255 188 265 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M195 140 C183 146 172 152 165 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M195 140 C207 146 218 152 225 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 110 C160 115 152 120 148 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M170 110 C180 115 188 120 192 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M135 42 C125 48 118 52 115 58" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M135 42 C145 48 152 52 155 58" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M280 290 C260 250 230 200 200 160 C178 130 160 105 150 85 C145 75 142 68 140 60" stroke="#e5e7e5" stroke-width="2.0"/>
      <path d="M230 200 C215 208 200 215 190 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M230 200 C245 208 260 215 270 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M200 160 C188 168 175 175 168 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M200 160 C212 168 225 175 232 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M170 130 C160 136 152 142 148 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 130 C180 136 188 142 192 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M150 105 C142 110 136 115 133 122" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M150 105 C158 110 164 115 167 122" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

    <h1 class="main-headline" id="headline">
      Иногда тебя понимает только тот, кто чувствует то же самое
      <span class="typewriter-cursor"></span>
    </h1>

    <p class="sub-headline">
      Расскажи о себе и найди похожих людей!
    </p>

    <button class="cta-button" id="firstCta">РАССКАЗАТЬ!</button>

    <div class="footer-link">
      <a href="#" id="loginLink">Уже есть аккаунт?</a>
    </div>

  </div>
</div>

<script>
  (function() {
    const appScreen = document.getElementById('appScreen');
    const firstCta = document.getElementById('firstCta');
    const loginLink = document.getElementById('loginLink');

    // ===== ТИПОГРАФСКИЙ ЭФФЕКТ =====
    const headline = document.getElementById('headline');
    const fullText = 'Иногда тебя понимает только тот, кто чувствует то же самое';
    let isTyping = false;
    let typeTimeout = null;

    function typeEffect(text, element, speed = 45) {
      if (isTyping) {
        clearTimeout(typeTimeout);
        isTyping = false;
      }

      let index = 0;
      let displayed = '';
      element.textContent = '';
      isTyping = true;

      function typeChar() {
        if (index < text.length) {
          displayed += text.charAt(index);
          element.textContent = displayed;
          const cursor = document.createElement('span');
          cursor.className = 'typewriter-cursor';
          element.appendChild(cursor);
          index++;
          typeTimeout = setTimeout(typeChar, speed);
        } else {
          const cursor = document.createElement('span');
          cursor.className = 'typewriter-cursor';
          element.appendChild(cursor);
          isTyping = false;
        }
      }

      typeChar();
    }

    setTimeout(() => typeEffect(fullText, headline, 50), 400);

    headline.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!isTyping) {
        typeEffect(fullText, this, 40);
      }
    });

    // ===== КНОПКИ =====
    firstCta.addEventListener('click', function() {
      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/demo-site/login';
      }, 350);
    });

    loginLink.addEventListener('click', function(e) {
      e.preventDefault();
      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/demo-site/login';
      }, 350);
    });

    // ===== БЛОКИРОВКА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

  })();
</script>

</body>
</html>
