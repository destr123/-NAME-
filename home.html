<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Главная — Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    /* ===== БАЗА ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0;
      animation: fernAppear 1.2s ease 0.2s forwards;
    }

    @keyframes fernAppear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .fern {
      position: absolute;
      stroke: #d9d9d9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      bottom: 0%;
      right: 0%;
      width: 55%;
      height: 60%;
      transform: rotate(-4deg);
      opacity: 0.22;
    }

    .fern-2 {
      bottom: 0%;
      right: -2%;
      width: 38%;
      height: 45%;
      transform: rotate(8deg);
      opacity: 0.18;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ ПАРЯЩИХ ЭЛЕМЕНТОВ ===== */
    .floating-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: calc(100% - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== ЛОГОТИП {NAME} ===== */
    .name-logo {
      font-size: clamp(48px, 12vw, 80px);
      font-weight: 700;
      color: #1e1e1e;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
      letter-spacing: 3px;
      opacity: 0;
      transform: scale(0.95);
      animation: logoAppear 0.8s ease 0.3s forwards;
      position: relative;
      z-index: 2;
      user-select: none;
    }

    .name-logo span {
      color: #2b7a4b;
    }

    @keyframes logoAppear {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ===== ОБЩИЕ СТИЛИ ДЛЯ ПАРЯЩИХ ЭЛЕМЕНТОВ ===== */
    .float-item {
      position: absolute;
      opacity: 0;
      animation: floatIn 0.7s ease forwards;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.2s ease;
    }

    .float-item:active {
      transform: scale(0.94);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px) rotate(-3deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
    }

    /* ===== ЭЛЕМЕНТ: НАЙТИ ЛЮДЕЙ ===== */
    .find-people {
      left: 5%;
      top: 18%;
      font-size: clamp(22px, 4.5vw, 36px);
      font-weight: 700;
      color: #2b7a4b;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
      letter-spacing: 1px;
      animation-delay: 0.6s;
      transform-origin: left center;
      border-bottom: 2px solid #2b7a4b;
      padding-bottom: 4px;
    }

    .find-people:hover {
      transform: scale(1.04);
      color: #1d5c34;
    }

    /* ===== ЭЛЕМЕНТ: ПОЧИТАТЬ ===== */
    .read-item {
      right: 12%;
      top: 22%;
      font-size: clamp(16px, 3vw, 24px);
      font-weight: 400;
      color: #4a4a4a;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      animation-delay: 0.8s;
      transform-origin: right center;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid #e8e8e8;
      backdrop-filter: blur(4px);
    }

    .read-item:hover {
      border-color: #2b7a4b;
      color: #1e1e1e;
    }

    /* ===== ЭЛЕМЕНТ: РАССКАЗАТЬ ===== */
    .tell-item {
      left: 18%;
      bottom: 28%;
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 500;
      color: #1e1e1e;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 500;
      animation-delay: 0.9s;
      transform-origin: left bottom;
      letter-spacing: 0.3px;
      padding: 8px 20px;
      border-radius: 40px;
      border: 1.5px dashed #d0d0d0;
    }

    .tell-item:hover {
      border-color: #2b7a4b;
      color: #2b7a4b;
    }

    /* ===== ЖЁЛТЫЙ КРУГ СОСТОЯНИЯ ===== */
    .mood-circle {
      position: absolute;
      right: 8%;
      top: 12%;
      width: clamp(70px, 14vw, 110px);
      height: clamp(70px, 14vw, 110px);
      border-radius: 50%;
      background: #f5e56b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: moodAppear 0.9s ease 1s forwards, float 6s ease-in-out infinite 2s;
      cursor: pointer;
      transform-origin: center;
      box-shadow: 0 8px 30px rgba(245, 229, 107, 0.3);
      border: 2px solid rgba(245, 229, 107, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .mood-circle:active {
      transform: scale(0.92);
    }

    @keyframes moodAppear {
      from {
        opacity: 0;
        transform: scale(0.7) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    .mood-circle .emoji {
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1;
    }

    .mood-circle .label {
      font-size: clamp(8px, 1.4vw, 11px);
      color: #1e1e1e;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      margin-top: 2px;
      letter-spacing: 0.3px;
      opacity: 0.7;
    }

    /* ===== МЕЛКИЕ ЭЛЕМЕНТЫ ===== */
    .tiny-1 {
      position: absolute;
      left: 55%;
      top: 8%;
      font-size: clamp(11px, 1.6vw, 14px);
      color: #b0b0b0;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      opacity: 0;
      animation: floatIn 0.6s ease 1.1s forwards;
      transform: rotate(-6deg);
      letter-spacing: 0.5px;
      user-select: none;
    }

    .tiny-2 {
      position: absolute;
      right: 25%;
      bottom: 35%;
      font-size: clamp(10px, 1.4vw, 12px);
      color: #c0c0c0;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      opacity: 0;
      animation: floatIn 0.6s ease 1.3s forwards;
      transform: rotate(4deg);
      letter-spacing: 0.3px;
      user-select: none;
    }

    .tiny-3 {
      position: absolute;
      left: 45%;
      bottom: 22%;
      font-size: clamp(9px, 1.2vw, 11px);
      color: #d0d0d0;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      opacity: 0;
      animation: floatIn 0.6s ease 1.5s forwards;
      transform: rotate(-3deg);
      user-select: none;
    }

    /* ===== НАВИГАЦИОННЫЙ ОСТРОВОК ===== */
    .nav-island {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid #2b7a4b;
      border-radius: 60px;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      opacity: 0;
      animation: navAppear 0.6s ease 1.6s forwards;
    }

    @keyframes navAppear {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      font-weight: 400;
      color: #4a4a4a;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 4px 8px;
      border-radius: 30px;
      border: 1px solid transparent;
      background: transparent;
    }

    .nav-item:hover {
      color: #1e1e1e;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-item .icon {
      font-size: 20px;
      line-height: 1;
    }

    .nav-item .label {
      font-size: 9px;
      letter-spacing: 0.3px;
      opacity: 0.6;
    }

    .nav-item.active {
      color: #2b7a4b;
    }

    .nav-item.active .label {
      opacity: 1;
      color: #2b7a4b;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 28px 16px 24px; }
      .nav-island {
        padding: 8px 14px;
        gap: 12px;
        bottom: 20px;
      }
      .nav-item .icon { font-size: 18px; }
      .nav-item .label { font-size: 8px; }
      .mood-circle { width: 60px; height: 60px; right: 4%; top: 10%; }
      .mood-circle .emoji { font-size: 20px; }
      .find-people { left: 2%; top: 16%; font-size: 18px; }
      .read-item { right: 4%; top: 20%; font-size: 14px; }
      .tell-item { left: 10%; bottom: 30%; font-size: 16px; }
      .tiny-1 { display: none; }
      .tiny-2 { display: none; }
      .tiny-3 { display: none; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 20px 12px 16px; }
      .name-logo { font-size: 36px; }
      .nav-island { padding: 6px 10px; gap: 8px; }
      .nav-item { padding: 2px 4px; }
      .nav-item .icon { font-size: 16px; }
      .mood-circle { width: 50px; height: 50px; }
      .mood-circle .emoji { font-size: 16px; }
      .find-people { font-size: 16px; }
      .read-item { font-size: 12px; padding: 4px 10px; }
      .tell-item { font-size: 14px; padding: 6px 14px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (min-height: 800px) {
      .find-people { top: 22%; }
      .read-item { top: 26%; }
      .tell-item { bottom: 32%; }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Фоновые папоротники -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M380 390 C350 340 300 270 250 210 C210 160 175 120 155 85 C145 68 138 55 135 42" stroke="#d9d9d9" stroke-width="2.2"/>
      <path d="M300 270 C280 280 260 290 245 300" stroke="#d9d9d9" stroke-width="1.6"/>
      <path d="M300 270 C320 280 340 290 355 300" stroke="#d9d9d9" stroke-width="1.6"/>
      <path d="M260 220 C242 228 225 235 212 245" stroke="#d9d9d9" stroke-width="1.4"/>
      <path d="M260 220 C278 228 295 235 308 245" stroke="#d9d9d9" stroke-width="1.4"/>
      <path d="M225 175 C210 182 195 188 185 198" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M225 175 C240 182 255 188 265 198" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M195 140 C183 146 172 152 165 162" stroke="#d9d9d9" stroke-width="1.0"/>
      <path d="M195 140 C207 146 218 152 225 162" stroke="#d9d9d9" stroke-width="1.0"/>
      <path d="M170 110 C160 115 152 120 148 128" stroke="#d9d9d9" stroke-width="0.9"/>
      <path d="M170 110 C180 115 188 120 192 128" stroke="#d9d9d9" stroke-width="0.9"/>
      <path d="M135 42 C125 48 118 52 115 58" stroke="#d9d9d9" stroke-width="0.8"/>
      <path d="M135 42 C145 48 152 52 155 58" stroke="#d9d9d9" stroke-width="0.8"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M280 290 C260 250 230 200 200 160 C178 130 160 105 150 85 C145 75 142 68 140 60" stroke="#d9d9d9" stroke-width="2.0"/>
      <path d="M230 200 C215 208 200 215 190 225" stroke="#d9d9d9" stroke-width="1.4"/>
      <path d="M230 200 C245 208 260 215 270 225" stroke="#d9d9d9" stroke-width="1.4"/>
      <path d="M200 160 C188 168 175 175 168 185" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M200 160 C212 168 225 175 232 185" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M170 130 C160 136 152 142 148 150" stroke="#d9d9d9" stroke-width="1.0"/>
      <path d="M170 130 C180 136 188 142 192 150" stroke="#d9d9d9" stroke-width="1.0"/>
      <path d="M150 105 C142 110 136 115 133 122" stroke="#d9d9d9" stroke-width="0.8"/>
      <path d="M150 105 C158 110 164 115 167 122" stroke="#d9d9d9" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- ===== ПАРЯЩИЙ КОНТЕЙНЕР ===== -->
  <div class="floating-container">

    <!-- Логотип {NAME} -->
    <div class="name-logo">
      <span>{</span>NAME<span>}</span>
    </div>

    <!-- НАЙТИ ЛЮДЕЙ -->
    <div class="float-item find-people" id="findPeople">
      НАЙТИ ЛЮДЕЙ
    </div>

    <!-- ПОЧИТАТЬ -->
    <div class="float-item read-item" id="readItem">
      почитать
    </div>

    <!-- РАССКАЗАТЬ -->
    <div class="float-item tell-item" id="tellItem">
      рассказать
    </div>

    <!-- ЖЁЛТЫЙ КРУГ СОСТОЯНИЯ -->
    <div class="mood-circle" id="moodCircle">
      <span class="emoji">😔</span>
      <span class="label">одиноко</span>
    </div>

    <!-- МЕЛКИЕ ЭЛЕМЕНТЫ -->
    <div class="tiny-1">✦ здесь можно найти</div>
    <div class="tiny-2">⋆ тихо</div>
    <div class="tiny-3">• и рядом</div>

  </div>

  <!-- ===== НАВИГАЦИОННЫЙ ОСТРОВОК ===== -->
  <div class="nav-island" id="navIsland">
    <a href="#" class="nav-item active" data-page="profile">
      <span class="icon">👤</span>
      <span class="label">Профиль</span>
    </a>
    <a href="#" class="nav-item" data-page="chats">
      <span class="icon">💬</span>
      <span class="label">Чаты</span>
    </a>
    <a href="#" class="nav-item" data-page="messenger">
      <span class="icon">✉</span>
      <span class="label">Мессенджер</span>
    </a>
  </div>

</div>

<script>
  (function() {
    'use strict';

    // ===== ЭЛЕМЕНТЫ =====
    const findPeople = document.getElementById('findPeople');
    const readItem = document.getElementById('readItem');
    const tellItem = document.getElementById('tellItem');
    const moodCircle = document.getElementById('moodCircle');
    const navItems = document.querySelectorAll('.nav-item');

    // ===== НАЙТИ ЛЮДЕЙ =====
    findPeople.addEventListener('click', function() {
      alert('🔍 Поиск людей…');
      // В будущем: window.location.href = '/search';
    });

    // ===== ПОЧИТАТЬ =====
    readItem.addEventListener('click', function() {
      alert('📖 Истории пользователей…');
      // В будущем: window.location.href = '/stories';
    });

    // ===== РАССКАЗАТЬ =====
    tellItem.addEventListener('click', function() {
      alert('✏️ Создание публикации…');
      // В будущем: window.location.href = '/create';
    });

    // ===== ЖЁЛТЫЙ КРУГ =====
    moodCircle.addEventListener('click', function() {
      alert('😔 Изменить состояние…');
      // В будущем: window.location.href = '/mood';
    });

    // ===== НАВИГАЦИЯ =====
    navItems.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();

        navItems.forEach(i => i.classList.remove('active'));
        this.classList.add('active');

        const page = this.dataset.page;
        const labels = {
          profile: '👤 Профиль',
          chats: '💬 Чаты',
          messenger: '✉ Мессенджер'
        };

        alert(`📱 Переход на: ${labels[page]}`);
        // В будущем: window.location.href = `/${page}`;
      });
    });

    // ===== БЛОКИРОВКА =====
    document.addEventListener('gesturestart', e => e.preventDefault());

    // ===== ЛЁГКОЕ ПЛАВАНИЕ ДЛЯ ЭЛЕМЕНТОВ (опционально) =====
    const floatItems = document.querySelectorAll('.float-item');
    floatItems.forEach((item, index) => {
      const delay = index * 0.4;
      const duration = 4 + (index % 3);
      const distance = 4 + (index % 5);

      item.style.animation = `
        floatIn 0.7s ease forwards,
        gentleFloat ${duration}s ease-in-out ${delay}s infinite
      `;

      // Добавляем ключевые кадры для плавания
      const style = document.createElement('style');
      style.textContent = `
        @keyframes gentleFloat {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-${distance}px) rotate(${index % 2 === 0 ? 1 : -1}deg); }
        }
      `;
      document.head.appendChild(style);
    });

  })();
</script>

</body>
</html>
