<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ты не один</title>
  <style>
    /* Сброс и база */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* Экран приложения — как в реальном мобильном приложении */
    .app-screen {
      position: relative;
      width: 100%;
      max-width: 390px; /* ширина iPhone 12/13/14 */
      aspect-ratio: 9 / 19.5; /* пропорции смартфона */
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.07), 0 8px 32px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      padding: 40px 28px 36px;
      display: flex;
      flex-direction: column;
    }

    /* ===== ДЕКОРАТИВНЫЙ ФОН — ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      opacity: 0.25;
      stroke: #d9d9d9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Крупные листья по краям — очень светлые, графичные */
    .fern-1 {
      top: -6%;
      right: -14%;
      width: 82%;
      height: 70%;
      transform: rotate(18deg);
      opacity: 0.20;
    }

    .fern-2 {
      bottom: -8%;
      left: -18%;
      width: 90%;
      height: 60%;
      transform: rotate(-12deg);
      opacity: 0.18;
    }

    .fern-3 {
      top: 28%;
      left: -12%;
      width: 50%;
      height: 40%;
      transform: rotate(40deg);
      opacity: 0.15;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 6%;
    }

    /* Статус-бар (для достоверности) */
    .status-bar {
      position: absolute;
      top: 16px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #1e1e1e;
      letter-spacing: 0.2px;
      z-index: 2;
      opacity: 0.6;
    }

    .status-bar .time {
      font-weight: 700;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .status-icons span {
      font-size: 13px;
    }

    /* Основной заголовок — "печатается" */
    .main-headline {
      font-size: 32px;
      font-weight: 650;
      line-height: 1.15;
      letter-spacing: -0.4px;
      color: #1e1e1e;
      max-width: 100%;
      margin-bottom: 28px;
    }

    /* Эффект печатной машинки — каретка */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 0.85em;
      background: #1e1e1e;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Подзаголовок */
    .sub-headline {
      font-size: 18px;
      font-weight: 420;
      line-height: 1.4;
      color: #4a4a4a;
      letter-spacing: 0.1px;
      margin-bottom: 48px;
      max-width: 90%;
    }

    /* Кнопка */
    .cta-button {
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      padding: 18px 40px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 20px rgba(43, 122, 75, 0.15);
      width: 100%;
      max-width: 280px;
      text-align: center;
      font-family: inherit;
    }

    .cta-button:hover {
      background: #236a3e;
      transform: scale(1.01);
    }

    .cta-button:active {
      transform: scale(0.97);
      background: #1d5c34;
    }

    /* Нижний колонтитул — очень лёгкий */
    .footer-note {
      margin-top: auto;
      padding-top: 20px;
      font-size: 12px;
      color: #c0c0c0;
      letter-spacing: 0.3px;
      text-align: center;
      width: 100%;
      font-weight: 400;
      z-index: 1;
      position: relative;
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen {
        border-radius: 32px;
        padding: 32px 20px 28px;
      }
      .main-headline {
        font-size: 28px;
      }
      .sub-headline {
        font-size: 16px;
        margin-bottom: 36px;
      }
      .cta-button {
        padding: 16px 32px;
        font-size: 16px;
        max-width: 100%;
      }
      .fern-1 { width: 100%; right: -10%; }
      .fern-2 { width: 100%; left: -10%; }
    }

    @media (max-width: 360px) {
      .main-headline {
        font-size: 24px;
      }
      .sub-headline {
        font-size: 14px;
      }
      .app-screen {
        padding: 24px 16px 20px;
        border-radius: 24px;
      }
    }

    /* Для удобства просмотра на десктопе — тень и центровка */
    @media (min-width: 600px) {
      body {
        background: #f5f5f7;
      }
      .app-screen {
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.08), 0 12px 40px rgba(0, 0, 0, 0.03);
      }
    }

    /* Интерактив для демонстрации печати — по клику */
    .typewriter-demo {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-screen">

  <!-- Статус-бар (имитация) -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <span>●●●●○</span>
      <span>◯</span>
      <span>◯</span>
    </div>
  </div>

  <!-- Фоновые папоротники — декоративный слой -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 20 C120 60 80 120 60 180 C50 210 45 240 50 270 C55 300 70 330 90 350 C110 370 130 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 20 C180 60 220 120 240 180 C250 210 255 240 250 270 C245 300 230 330 210 350 C190 370 170 380 150 380" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M150 40 C130 80 100 130 85 180 C78 210 75 240 80 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 40 C170 80 200 130 215 180 C222 210 225 240 220 270" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M150 60 C140 100 125 150 120 200 C118 220 118 240 122 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M150 60 C160 100 175 150 180 200 C182 220 182 240 178 260" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M85 180 C75 200 68 220 65 240" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M215 180 C225 200 232 220 235 240" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 380 C60 340 100 280 140 220 C160 190 175 160 185 130 C195 100 200 70 195 40 C190 20 180 10 170 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M30 380 C0 340 -40 280 -80 220 C-100 190 -115 160 -125 130 C-135 100 -140 70 -135 40 C-130 20 -120 10 -110 5" stroke="#d9d9d9" stroke-width="1.8"/>
      <path d="M50 360 C70 320 100 270 130 220 C145 195 155 170 162 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M10 360 C-10 320 -40 270 -70 220 C-85 195 -95 170 -102 145" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M70 340 C90 300 115 255 140 210 C150 190 158 170 163 150" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M-10 340 C-30 300 -55 255 -80 210 C-90 190 -98 170 -103 150" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>

    <svg class="fern fern-3" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 280 C40 240 80 180 110 120 C125 90 135 60 138 30 C139 15 135 5 130 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M20 280 C0 240 -40 180 -70 120 C-85 90 -95 60 -98 30 C-99 15 -95 5 -90 0" stroke="#d9d9d9" stroke-width="1.5"/>
      <path d="M30 260 C50 220 80 170 105 120 C115 100 122 80 125 60" stroke="#d9d9d9" stroke-width="1.2"/>
      <path d="M10 260 C-10 220 -40 170 -65 120 C-75 100 -82 80 -85 60" stroke="#d9d9d9" stroke-width="1.2"/>
    </svg>
  </div>

  <!-- Основной контент -->
  <div class="content">

    <!-- Заголовок с эффектом печатной машинки -->
    <h1 class="main-headline typewriter-demo" id="headline">
      Иногда тебя понимает только тот, кто чувствует то же самое
      <span class="typewriter-cursor" id="cursor"></span>
    </h1>

    <!-- Подзаголовок -->
    <p class="sub-headline">
      Расскажи о себе и найди похожих людей!
    </p>

    <!-- Кнопка -->
    <button class="cta-button" id="mainCta">
      РАССКАЗАТЬ!
    </button>
  </div>

  <!-- Лёгкий футер для достоверности -->
  <div class="footer-note">
    Ты не один
  </div>
</div>

<script>
  (function() {
    // Демонстрация эффекта печатной машинки — при клике на заголовок
    const headline = document.getElementById('headline');
    const cursor = document.getElementById('cursor');
    const fullText = headline.textContent.replace('█', '').trim(); // чистим от курсора

    // Сохраняем оригинал для сброса
    let originalText = fullText;

    // Функция "печатания"
    function typeEffect(text, element, cursorElement, speed = 45) {
      let index = 0;
      let displayed = '';

      // Очищаем текст
      element.textContent = '';

      function typeChar() {
        if (index < text.length) {
          displayed += text.charAt(index);
          element.textContent = displayed;
          // Добавляем курсор в конец
          if (cursorElement) {
            // Удаляем старый курсор если есть
            const hasCursor = element.querySelector('.typewriter-cursor');
            if (hasCursor) {
              hasCursor.remove();
            }
            // Добавляем новый курсор
            const newCursor = document.createElement('span');
            newCursor.className = 'typewriter-cursor';
            newCursor.id = 'cursor';
            element.appendChild(newCursor);
          }
          index++;
          setTimeout(typeChar, speed);
        } else {
          // Текст напечатан — курсор остаётся моргать
          if (cursorElement) {
            // Удаляем старый курсор
            const oldCursor = element.querySelector('.typewriter-cursor');
            if (oldCursor) {
              oldCursor.remove();
            }
            // Создаём новый
            const finalCursor = document.createElement('span');
            finalCursor.className = 'typewriter-cursor';
            finalCursor.id = 'cursor';
            element.appendChild(finalCursor);
          }
        }
      }

      typeChar();
    }

    // При клике на заголовок — перепечатываем
    headline.addEventListener('click', function(e) {
      // Останавливаем всплытие, чтобы не мешать
      e.stopPropagation();
      // Убираем курсор из текста для чистоты
      const cleanText = fullText;
      // Сбрасываем и печатаем заново
      typeEffect(cleanText, this, cursor, 40);
    });

    // Кнопка "РАССКАЗАТЬ!" — лёгкий фидбек
    const ctaBtn = document.getElementById('mainCta');
    ctaBtn.addEventListener('click', function() {
      // В реальном приложении здесь открывается экран анкеты
      alert('🚀 Экран анкеты');
      // Можно добавить анимацию нажатия
      this.style.transform = 'scale(0.95)';
      setTimeout(() => {
        this.style.transform = '';
      }, 150);
    });

    // При загрузке — напечатать текст автоматически
    window.addEventListener('load', function() {
      // Небольшая задержка для красоты
      setTimeout(() => {
        const cleanText = fullText;
        typeEffect(cleanText, headline, cursor, 50);
      }, 400);
    });

    // Для мобильных — убираем подсветку при тапе
    document.addEventListener('touchstart', function() {}, { passive: true });

  })();
</script>

</body>
</html>
