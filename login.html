<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Вход — Ты не один</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inconsolata', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 36px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПАПОРОТНИКИ ===== */
    .fern-bg {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 70%;
      height: 70%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fern {
      position: absolute;
      stroke: #e5e7e5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fern-1 {
      bottom: 0%;
      right: 0%;
      width: 55%;
      height: 60%;
      transform: rotate(-4deg);
      opacity: 0.45;
    }

    .fern-2 {
      bottom: 0%;
      right: -2%;
      width: 38%;
      height: 45%;
      transform: rotate(8deg);
      opacity: 0.35;
    }

    /* ===== КОНТЕНТ ===== */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding-bottom: 4%;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e1e1e;
      user-select: none;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }
    .logo span { color: #2b7a4b; }

    .page-title {
      font-size: clamp(26px, 6.5vw, 36px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #1e1e1e;
      margin-bottom: 8px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 700;
    }

    .sub-title {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.2px;
      color: #1e1e1e;
      margin-bottom: 24px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 18px 20px;
      font-size: 17px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
      color: #1e1e1e;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-field:focus {
      border-color: #2b7a4b;
      box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.08);
    }
    .input-field.error { border-color: #e74c3c; }
    .input-field::placeholder {
      color: #b0b0b0;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .error-message {
      display: none;
      font-size: 13px;
      color: #e74c3c;
      margin-top: 6px;
      padding-left: 4px;
      animation: shake 0.3s ease;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .error-message.visible { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 12px 0 28px;
      color: #b8b8b8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8e8;
    }

    .social-label {
      font-size: 15px;
      color: #4a4a4a;
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }

    .social-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .social-btn {
      flex: 1;
      min-width: 80px;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid #e0e0e0;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      color: #1e1e1e;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 500;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .social-btn:active {
      transform: scale(0.96);
      border-color: #2b7a4b;
      background: #f8faf9;
    }
    .social-btn.telegram:hover { border-color: #0088cc; background: #f0f7fc; }
    .social-btn.google:hover { border-color: #ea4335; background: #fcf0ef; }
    .social-btn.apple:hover { border-color: #1e1e1e; background: #f5f5f5; }

    .cta-button {
      width: 100%;
      padding: 18px;
      margin-top: 4px;
      background: #2b7a4b;
      color: #ffffff;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(43, 122, 75, 0.18);
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 600;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .cta-button:active {
      transform: scale(0.96);
      background: #1d5c34;
    }

    .footer-link {
      margin-top: auto;
      text-align: center;
      font-size: 15px;
      color: #4a4a4a;
      font-weight: 400;
      padding-top: 20px;
      letter-spacing: 0.2px;
      font-family: 'Inconsolata', monospace;
      font-variation-settings: 'wght' 400;
    }
    .footer-link a {
      color: #2b7a4b;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      font-variation-settings: 'wght' 500;
    }
    .footer-link a:active { border-bottom-color: #2b7a4b; }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 420px) {
      .app-screen { padding: 32px 20px 28px; }
      .logo { font-size: 17px; margin-bottom: 24px; }
      .input-field { padding: 16px 18px; font-size: 16px; }
      .cta-button { padding: 16px; font-size: 16px; }
      .social-btn { font-size: 13px; padding: 12px 6px; min-width: 60px; }
      .social-btn svg { width: 18px; height: 18px; }
      .page-title { font-size: 22px; }
      .sub-title { font-size: 18px; }
    }

    @media (max-width: 360px) {
      .app-screen { padding: 24px 16px 20px; }
      .page-title { font-size: 20px; }
      .sub-title { font-size: 16px; }
      .input-field { padding: 14px 16px; font-size: 15px; }
      .cta-button { padding: 14px; font-size: 15px; }
      .social-btn { font-size: 12px; padding: 10px 4px; min-width: 50px; }
      .social-btn svg { width: 16px; height: 16px; }
    }

    @media (min-width: 600px) {
      .app-screen {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.06);
      }
      body {
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Папоротники -->
  <div class="fern-bg" aria-hidden="true">
    <svg class="fern fern-1" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M380 390 C350 340 300 270 250 210 C210 160 175 120 155 85 C145 68 138 55 135 42" stroke="#e5e7e5" stroke-width="2.2"/>
      <path d="M300 270 C280 280 260 290 245 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M300 270 C320 280 340 290 355 300" stroke="#e5e7e5" stroke-width="1.6"/>
      <path d="M260 220 C242 228 225 235 212 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M260 220 C278 228 295 235 308 245" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M225 175 C210 182 195 188 185 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M225 175 C240 182 255 188 265 198" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M195 140 C183 146 172 152 165 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M195 140 C207 146 218 152 225 162" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 110 C160 115 152 120 148 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M170 110 C180 115 188 120 192 128" stroke="#e5e7e5" stroke-width="0.9"/>
      <path d="M135 42 C125 48 118 52 115 58" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M135 42 C145 48 152 52 155 58" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>

    <svg class="fern fern-2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M280 290 C260 250 230 200 200 160 C178 130 160 105 150 85 C145 75 142 68 140 60" stroke="#e5e7e5" stroke-width="2.0"/>
      <path d="M230 200 C215 208 200 215 190 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M230 200 C245 208 260 215 270 225" stroke="#e5e7e5" stroke-width="1.4"/>
      <path d="M200 160 C188 168 175 175 168 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M200 160 C212 168 225 175 232 185" stroke="#e5e7e5" stroke-width="1.2"/>
      <path d="M170 130 C160 136 152 142 148 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M170 130 C180 136 188 142 192 150" stroke="#e5e7e5" stroke-width="1.0"/>
      <path d="M150 105 C142 110 136 115 133 122" stroke="#e5e7e5" stroke-width="0.8"/>
      <path d="M150 105 C158 110 164 115 167 122" stroke="#e5e7e5" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <div class="logo"><span>{</span>LOGOTYPE<span>}</span></div>

    <h1 class="page-title">Вход</h1>
    <p class="sub-title">Введи почту</p>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="email" class="input-field" id="loginEmail" placeholder="Электронная почта" autocomplete="email" inputmode="email" />
        <div class="error-message" id="emailError"></div>
      </div>
    </div>

    <div class="divider">ИЛИ</div>

    <p class="social-label">Войти с помощью:</p>

    <div class="social-buttons">
      <button class="social-btn telegram">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        TELEGRAM
      </button>
      <button class="social-btn google">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        GOOGLE
      </button>
      <button class="social-btn apple">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        APPLE
      </button>
    </div>

    <button class="cta-button" id="loginBtn">ВОЙТИ</button>

    <div class="footer-link">
      Нет аккаунта? <a href="#" id="toRegister">зарегистрироваться</a>
    </div>

  </div>
</div>

<script>
  (function() {
    const appScreen = document.getElementById('appScreen');
    const loginEmail = document.getElementById('loginEmail');
    const emailError = document.getElementById('emailError');
    const loginBtn = document.getElementById('loginBtn');
    const toRegister = document.getElementById('toRegister');

    // ===== АНИМАЦИЯ =====
    setTimeout(() => {
      appScreen.style.opacity = '1';
      appScreen.style.transform = 'translateY(0)';
    }, 50);

    // ===== ВАЛИДАЦИЯ =====
    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.add('error');
    }

    function hideError(el) {
      el.classList.remove('visible');
      const input = el.closest('.input-wrapper').querySelector('.input-field');
      if (input) input.classList.remove('error');
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    loginEmail.addEventListener('blur', function() {
      const val = this.value.trim();
      if (val && !isValidEmail(val)) {
        showError(emailError, 'Некорректный email');
      } else {
        hideError(emailError);
      }
    });

    loginEmail.addEventListener('input', () => hideError(emailError));

    loginBtn.addEventListener('click', function() {
      const email = loginEmail.value.trim();
      if (!email) {
        showError(emailError, 'Введите email');
        return;
      }
      if (!isValidEmail(email)) {
        showError(emailError, 'Некорректный email');
        return;
      }

      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/-NAME-/home';
      }, 350);
    });

    toRegister.addEventListener('click', function(e) {
      e.preventDefault();
      appScreen.style.opacity = '0';
      appScreen.style.transform = 'translateY(-8px)';
      appScreen.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      setTimeout(() => {
        window.location.href = 'https://destr123.github.io/-NAME-/reg';
      }, 350);
    });

    loginEmail.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    // ===== СОЦКНОПКИ =====
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const provider = this.textContent.trim();
        alert(`🔐 Вход через ${provider}`);
      });
    });

    document.addEventListener('gesturestart', e => e.preventDefault());

  })();
</script>

</body>
</html>
